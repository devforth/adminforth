name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'documentation/**'
      # AFCL previews of the docs are built from these
      - 'adminforth/spa/src/afcl/**'
      - 'adminforth/modules/styles.ts'
      - '.github/workflows/deploy_documentation.yaml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: documentation
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: |
            adminforth/pnpm-lock.yaml
            documentation/pnpm-lock.yaml

      - name: Configure Git
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      # adminforth itself is needed too: the API pages are generated from its types, AFCL previews from its SPA
      - name: Install dependencies
        run: |
          pnpm --dir ../adminforth install
          pnpm install

      - name: Build and deploy docs
        env:
          GIT_USER: ${{ github.actor }}
          GIT_PASS: ${{ secrets.DOCUSAURUS_DEPLOY_KEY }}
        run: pnpm run build && pnpm run deploy
