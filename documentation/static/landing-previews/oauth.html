<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OAuth sign-in</title>
<link rel="stylesheet" href="previews.css">
<style>
  .or { display: flex; align-items: center; gap: 12px; font-size: 12px; line-height: 16px; color: var(--muted); }
  .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .oauth { width: auto; }
  .oauth svg { width: 18px; height: 18px; }
</style>
</head>
<body>
<!-- core LoginView on DialogPanel with the provider buttons of the OAuth plugin (iconOnly) under an "or" divider -->
<div class="screen center">
  <div style="width: 368px; overflow: hidden; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-xs)">
    <div style="padding: 20px 24px; border-bottom: 1px solid var(--border)">
      <h3 style="font-size: 18px; line-height: 24px; font-weight: 600">Sign in to My Admin</h3>
    </div>
    <div style="padding: 20px 24px 24px; display: flex; flex-direction: column; gap: 16px; font-size: 14px">
      <div>
        <div style="margin-bottom: 8px; font-weight: 500">Your email</div>
        <div class="input">adminforth</div>
      </div>
      <div>
        <div style="margin-bottom: 8px; font-weight: 500">Your password</div>
        <div class="input" style="justify-content: space-between; letter-spacing: 2px">••••••••••<svg class="i"><use href="icons.svg#eye"/></svg></div>
      </div>
      <div class="btn btn-primary">Login to your account</div>
      <div class="or">or continue with</div>
      <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
        <div class="btn btn-secondary btn-icon oauth" style="color: var(--text)"><svg><use href="brands.svg#github"/></svg></div>
        <div class="btn btn-secondary btn-icon oauth"><svg><use href="brands.svg#google"/></svg></div>
        <div class="btn btn-secondary btn-icon oauth"><svg><use href="brands.svg#facebook"/></svg></div>
        <div class="btn btn-secondary btn-icon oauth"><svg><use href="brands.svg#microsoft"/></svg></div>
        <div class="btn btn-secondary btn-icon oauth"><svg><use href="brands.svg#keycloak"/></svg></div>
      </div>
    </div>
  </div>
</div>
<script src="previews.js"></script>
</body>
</html>
