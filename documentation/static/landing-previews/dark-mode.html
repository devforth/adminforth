<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Dark mode</title>
<link rel="stylesheet" href="previews.css">
<style>
  .ft td { border-bottom-color: var(--divider); }
</style>
</head>
<body>
<!-- show view of a record in the dark theme, dark whatever theme the landing page has -->
<div class="screen app" style="width: 880px; height: 550px">
  <aside class="side" data-active="Apartments"></aside>
  <div class="page">
    <header class="topbar">
      <span class="btn btn-secondary"><svg class="i"><use href="icons.svg#bot"/></svg>Agent</span>
      <span class="btn btn-ghost btn-icon"><svg class="i"><use href="icons.svg#sun"/></svg></span>
      <span class="avatar"><svg class="i"><use href="icons.svg#user"/></svg></span>
    </header>
    <main class="content">
      <div class="list-head">
        <nav class="crumbs"><svg class="i"><use href="icons.svg#house"/></svg>Home<svg class="i sep"><use href="icons.svg#chevron-right"/></svg>Apartments<svg class="i sep"><use href="icons.svg#chevron-right"/></svg><h1>Show Apartment</h1></nav>
        <div class="btns">
          <span class="btn btn-secondary"><svg class="i"><use href="icons.svg#pencil"/></svg>Edit</span>
          <span class="btn btn-secondary" style="color: var(--danger-fg)"><svg class="i" style="color: var(--danger-fg)"><use href="icons.svg#trash-2"/></svg>Delete</span>
          <span class="btn btn-secondary btn-icon"><svg class="i"><use href="icons.svg#ellipsis"/></svg></span>
        </div>
      </div>
      <table class="ft">
        <thead><tr><th>Field</th><th>Value</th></tr></thead>
        <tbody>
          <tr><td>Title</td><td>Downtown luxury living</td></tr>
          <tr><td>Created at</td><td>Oct 7, 2026 12:18:28</td></tr>
          <tr><td>Image</td><td><img src="villa.jpg" alt="" style="display: block; width: 100%; border-radius: 6px"></td></tr>
          <tr><td>Price</td><td class="num">$1,518.65</td></tr>
          <tr><td>Listed</td><td><span class="badge badge-success"><svg class="i"><use href="icons.svg#check"/></svg>Yes</span></td></tr>
        </tbody>
      </table>
    </main>
  </div>
</div>
<script src="previews.js"></script>
</body>
</html>
