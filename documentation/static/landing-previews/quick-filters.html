<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quick filters</title>
<link rel="stylesheet" href="previews.css">
<style>
  .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
  .opt { display: flex; align-items: center; min-height: 32px; padding: 0 10px; border-radius: 6px; font-size: 14px; color: var(--text-2); }
  .opt.is-on { background: var(--surface-3); color: var(--text); font-weight: 500; }
  .acts { display: flex; gap: 2px; color: var(--muted); }
  .at td.act { padding-top: 8px; padding-bottom: 8px; }
</style>
</head>
<body>
<!-- list header narrower than 896px: the quick filters take their own row under the title, a select is open -->
<div class="screen app" style="width: 880px; height: 550px">
  <aside class="side" data-active="Cars"></aside>
  <div class="page">
    <header class="topbar">
      <span class="btn btn-secondary"><svg class="i"><use href="icons.svg#bot"/></svg>Agent</span>
      <span class="btn btn-ghost btn-icon"><svg class="i"><use href="icons.svg#moon"/></svg></span>
      <span class="avatar"><svg class="i"><use href="icons.svg#user"/></svg></span>
    </header>
    <main class="content">
      <div class="list-head">
        <nav class="crumbs"><svg class="i"><use href="icons.svg#house"/></svg>Home<svg class="i sep"><use href="icons.svg#chevron-right"/></svg><h1>Cars</h1></nav>
        <div class="btns">
          <span class="btn btn-primary"><svg class="i"><use href="icons.svg#plus"/></svg>Create</span>
          <span class="btn btn-secondary"><svg class="i"><use href="icons.svg#list-filter"/></svg>Filter</span>
          <span class="btn btn-secondary btn-icon"><svg class="i"><use href="icons.svg#ellipsis"/></svg></span>
        </div>
        <div class="filters">
          <div class="input select is-focus">Premium<svg class="i" style="rotate: 180deg"><use href="icons.svg#chevron-down"/></svg></div>
          <div class="input" style="justify-content: space-between">Eclipse<svg class="i"><use href="icons.svg#x"/></svg></div>
        </div>
      </div>
      <table class="at rows">
        <thead>
          <tr>
            <th style="width: 48px"><input class="cb" type="checkbox"></th>
            <th><span class="sort">Model<svg class="i"><use href="icons.svg#chevrons-up-down"/></svg></span></th>
            <th><span class="sort">Price<svg class="i"><use href="icons.svg#chevrons-up-down"/></svg></span></th>
            <th><span class="sort">Year<svg class="i"><use href="icons.svg#chevrons-up-down"/></svg></span></th>
            <th>Listed</th>
            <th style="width: 1%">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><input class="cb" type="checkbox"></td>
            <td style="color: var(--text); font-weight: 500">Eclipse GT</td>
            <td class="num">$12,480</td>
            <td class="num">2024</td>
            <td><span class="badge badge-success"><svg class="i"><use href="icons.svg#check"/></svg>Yes</span></td>
            <td class="act"><div class="acts"><span class="btn btn-ghost btn-icon btn-sm"><svg class="i"><use href="icons.svg#eye"/></svg></span><span class="btn btn-ghost btn-icon btn-sm"><svg class="i"><use href="icons.svg#pencil"/></svg></span><span class="btn btn-ghost btn-icon btn-sm"><svg class="i"><use href="icons.svg#trash-2"/></svg></span></div></td>
          </tr>
          <tr>
            <td><input class="cb" type="checkbox"></td>
            <td style="color: var(--text); font-weight: 500">Eclipse Spyder</td>
            <td class="num">$11,950</td>
            <td class="num">2023</td>
            <td><span class="badge badge-muted">No</span></td>
            <td class="act"><div class="acts"><span class="btn btn-ghost btn-icon btn-sm"><svg class="i"><use href="icons.svg#eye"/></svg></span><span class="btn btn-ghost btn-icon btn-sm"><svg class="i"><use href="icons.svg#pencil"/></svg></span><span class="btn btn-ghost btn-icon btn-sm"><svg class="i"><use href="icons.svg#trash-2"/></svg></span></div></td>
          </tr>
          <tr>
            <td><input class="cb" type="checkbox"></td>
            <td style="color: var(--text); font-weight: 500">Eclipse Coupe</td>
            <td class="num">$10,720</td>
            <td class="num">2022</td>
            <td><span class="badge badge-success"><svg class="i"><use href="icons.svg#check"/></svg>Yes</span></td>
            <td class="act"><div class="acts"><span class="btn btn-ghost btn-icon btn-sm"><svg class="i"><use href="icons.svg#eye"/></svg></span><span class="btn btn-ghost btn-icon btn-sm"><svg class="i"><use href="icons.svg#pencil"/></svg></span><span class="btn btn-ghost btn-icon btn-sm"><svg class="i"><use href="icons.svg#trash-2"/></svg></span></div></td>
          </tr>
          <tr>
            <td><input class="cb" type="checkbox"></td>
            <td style="color: var(--text); font-weight: 500">Eclipse Cross</td>
            <td class="num">$10,105</td>
            <td class="num">2021</td>
            <td><span class="badge badge-success"><svg class="i"><use href="icons.svg#check"/></svg>Yes</span></td>
            <td class="act"><div class="acts"><span class="btn btn-ghost btn-icon btn-sm"><svg class="i"><use href="icons.svg#eye"/></svg></span><span class="btn btn-ghost btn-icon btn-sm"><svg class="i"><use href="icons.svg#pencil"/></svg></span><span class="btn btn-ghost btn-icon btn-sm"><svg class="i"><use href="icons.svg#trash-2"/></svg></span></div></td>
          </tr>
        </tbody>
      </table>
    </main>
  </div>
  <div class="pop" style="position: absolute; top: 169px; left: 280px; width: 280px">
    <span class="opt">Budget-Friendly</span>
    <span class="opt">Mid-Range</span>
    <span class="opt is-on">Premium</span>
  </div>
</div>
<script src="previews.js"></script>
</body>
</html>
